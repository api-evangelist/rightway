summary: >-
  Rightway's published conformance posture is regulatory and certification-based,
  not API-technical. The company announced HITRUST CSF certification together with
  SOC 2 in May 2022 covering its care navigation and PBM solutions, operates as a
  HIPAA-regulated handler of protected health information, and publishes state PBM
  regulatory filings. No API-level standard (OAuth 2.0, OpenID Connect, FHIR, RFC
  9457, SCIM, OData) can be asserted because Rightway publishes no machine-readable
  API contract and no developer documentation.
