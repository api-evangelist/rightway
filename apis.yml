aid: rightway
name: Rightway
description: 'Rightway Healthcare is a New York-based healthcare navigation and pharmacy
  benefit management (PBM) company founded by Jordan Feldman and Dr. Theodore Feldman.
  It pairs a clinical care-navigation service — licensed pharmacists, nurses and care
  guides reachable by phone and in-app — with a fully transparent, 100% pass-through
  PBM that earns revenue from a single administrative fee rather than rebate spread.
  Rightway serves employers, health systems and public-sector plans covering roughly
  three million members, with named clients including Tyson Foods, TikTok and Zoom,
  and ships member-facing iOS, Android and web apps backed by a private mobile API.
  The company is HITRUST CSF certified and SOC 2 attested. It publishes no public
  developer program, API documentation or machine-readable API contract as of this
  profiling pass.'
