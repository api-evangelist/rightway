apis:
- aid: rightway:member-api
  name: Rightway Member API
  description: 'Undocumented private HTTP/JSON API at api.rightwayhealthcare.com that
    backs the Rightway member mobile apps (iOS/Android) and the member web app at
    member.rightwayhealthcare.com. The host is publicly reachable and answers unauthenticated
    JSON on / (minimum supported app versions) and /health (dependency readiness),
    but Rightway publishes no developer portal, no API reference and no OpenAPI/GraphQL
    contract; all functional endpoints are member-authenticated. Recorded here from
    direct probing, not from provider documentation.'
  humanURL: https://member.rightwayhealthcare.com/
  baseURL: https://api.rightwayhealthcare.com
